<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>今天吃什麼</title>
<meta name="theme-color" content="#ff6433" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fff7f1;
    --surface: #ffffff;
    --surface-2: #fff0e6;
    --text: #2a1c15;
    --muted: #8c776b;
    --line: #f1e1d6;
    --accent: #ff6433;
    --accent-2: #ffa53d;
    --accent-soft: #ffe8dd;
    --ok: #1f9d6b;
    --warn-bg: #fff4d6;
    --warn-text: #7a5200;
    --warn-line: #f3dc9c;
    --shadow: 0 8px 28px rgba(140, 70, 30, .10);
    --radius: 20px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16110e;
      --surface: #211a16;
      --surface-2: #2b221d;
      --text: #f6ebe4;
      --muted: #ad998d;
      --line: #382d27;
      --accent: #ff7447;
      --accent-2: #ffb35c;
      --accent-soft: #3d2519;
      --ok: #37c28c;
      --warn-bg: #3a2e12;
      --warn-text: #f3d38a;
      --warn-line: #5a4718;
      --shadow: 0 8px 28px rgba(0, 0, 0, .4);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }

  .app { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }

  /* ---------- Header ---------- */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .greet { margin: 0; color: var(--muted); font-size: 14px; font-weight: 500; }
  h1 { margin: 2px 0 0; font-size: 30px; font-weight: 900; letter-spacing: .5px; line-height: 1.2; }
  h1 span {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .loc-pill {
    display: inline-flex; align-items: center; gap: 6px; max-width: 52%;
    margin-top: 4px; padding: 8px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
    font-size: 13px; font-weight: 500; white-space: nowrap;
  }
  .loc-pill span { overflow: hidden; text-overflow: ellipsis; }
  .loc-pill b { color: var(--accent); font-weight: 700; flex: none; }

  .banner {
    display: flex; gap: 8px; align-items: flex-start;
    background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-line);
    padding: 10px 14px; border-radius: 14px; font-size: 13px; margin-bottom: 16px;
  }
  .banner p { margin: 0; flex: 1; }
  .retry {
    flex: none; align-self: center; border: 1px solid currentColor; background: transparent;
    color: inherit; border-radius: 999px; padding: 3px 12px; font-size: 12.5px; font-weight: 700;
  }

  /* ---------- Layout ---------- */
  .layout { display: flex; flex-direction: column; gap: 16px; }
  .col { display: contents; }
  #controls { order: 1; } #result { order: 2; } #mapCard { order: 3; } #listCard { order: 4; } #historyCard { order: 5; }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px;
  }
  .label { display: flex; align-items: baseline; justify-content: space-between; font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .label small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .label b { color: var(--accent); }
  .field + .field { margin-top: 20px; }

  /* meal segmented control */
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--surface-2); padding: 5px; border-radius: 14px; }
  .seg button {
    border: 0; background: transparent; padding: 8px 0; border-radius: 10px;
    font-size: 14px; font-weight: 500; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    transition: background .15s, color .15s;
  }
  .seg button .e { font-size: 19px; line-height: 1.2; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.08); }

  /* radius chips */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--surface);
    padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 500;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

  /* category tiles */
  .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cat {
    position: relative; border: 1.5px solid var(--line); background: var(--surface);
    border-radius: 14px; padding: 10px 2px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 12.5px; font-weight: 500;
    transition: transform .12s, border-color .15s, background .15s;
  }
  .cat .e { font-size: 24px; line-height: 1; }
  .cat .n { position: absolute; top: 3px; right: 6px; font-size: 10px; color: var(--muted); font-weight: 500; }
  .cat[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .cat:active { transform: scale(.95); }

  .toggle { display: flex; align-items: center; gap: 8px; margin-top: 18px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 17px; height: 17px; margin: 0; }

  .cta {
    margin-top: 16px; width: 100%; border: 0; border-radius: 16px; padding: 16px;
    font-size: 19px; font-weight: 900; letter-spacing: 2px; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 24px rgba(255, 100, 51, .35);
    transition: transform .1s, box-shadow .1s, opacity .2s;
  }
  .cta:hover { box-shadow: 0 12px 28px rgba(255, 100, 51, .45); }
  .cta:active { transform: translateY(2px) scale(.99); box-shadow: 0 5px 14px rgba(255, 100, 51, .3); }
  .cta:disabled { opacity: .75; cursor: wait; }
  .cta .dice { display: inline-block; }
  .cta.rolling .dice { animation: roll .5s linear infinite; }
  @keyframes roll { to { transform: rotate(360deg); } }

  /* ---------- Result ---------- */
  .result { padding: 0; overflow: hidden; }
  .slot {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; padding: 20px 18px 22px; text-align: center;
  }
  .slot-kicker { font-size: 13px; opacity: .92; font-weight: 500; letter-spacing: 1px; }
  .slot-main { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 4px; min-height: 64px; }
  .slot-emoji { font-size: 48px; line-height: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,.18)); }
  .slot-name { font-size: 30px; font-weight: 900; letter-spacing: 1px; }
  .slot.spinning .slot-main { animation: jitter .12s linear infinite; }
  .slot.landed .slot-main { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes jitter { 0%, 100% { transform: translateY(-3px); } 50% { transform: translateY(3px); } }
  @keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }

  .pick { padding: 16px 18px 2px; }
  .pick-idle { margin: 4px 0 14px; color: var(--muted); font-size: 14px; text-align: center; }
  .pick-name { font-size: 20px; font-weight: 700; line-height: 1.35; }
  .pick-meta { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .tags { margin-top: 4px; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin: 6px 6px 0 0; }
  .tag.hit { background: rgba(31, 157, 107, .13); color: var(--ok); font-weight: 700; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px 18px 0; }
  .actions.sub { grid-template-columns: 1fr 1fr 1.25fr; padding-top: 8px; padding-bottom: 18px; }
  .actions .wide { grid-column: 1 / -1; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
    padding: 11px 10px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap;
    transition: filter .15s, transform .1s;
  }
  .btn:hover { filter: brightness(.97); }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.ghost { background: var(--surface-2); border-color: transparent; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ---------- Map ---------- */
  .map-card { padding: 0; overflow: hidden; }
  .map-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; }
  .map-head h2 { margin: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .map-head a { flex: none; font-size: 12.5px; font-weight: 700; color: var(--accent); text-decoration: none; }
  .map-wrap { position: relative; height: 280px; background: var(--surface-2); }
  .map-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .map-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }

  /* ---------- List ---------- */
  .list-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .list-head h2 { font-size: 17px; margin: 0; }
  .list-head span { font-size: 13px; color: var(--muted); }
  .list { list-style: none; margin: 0; padding: 0; }
  .item {
    display: flex; align-items: center; gap: 12px; padding: 10px 8px; margin: 0 -8px;
    border-radius: 12px; cursor: pointer; transition: background .12s;
  }
  .item + .item { border-top: 1px solid var(--line); }
  .item:hover { background: var(--surface-2); }
  .item.active { background: var(--accent-soft); }
  .item-emoji { width: 42px; height: 42px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; font-size: 22px; flex: none; }
  .item.active .item-emoji { background: var(--surface); }
  .item-body { flex: 1; min-width: 0; }
  .item-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-dist { text-align: right; font-size: 14px; font-weight: 700; flex: none; }
  .item-dist small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
  .more { margin-top: 10px; width: 100%; }
  .empty { padding: 22px 8px; text-align: center; color: var(--muted); font-size: 14px; }
  .empty a { color: var(--accent); font-weight: 700; }
  .sk { display: flex; gap: 12px; align-items: center; padding: 10px 0; }
  .sk i { display: block; border-radius: 10px; background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------- History ---------- */
  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { display: flex; gap: 10px; align-items: center; padding: 8px 0; font-size: 14px; }
  .hist li + li { border-top: 1px solid var(--line); }
  .hist .h-e { font-size: 20px; width: 28px; text-align: center; }
  .hist small { display: block; color: var(--muted); font-size: 12px; }
  .link-btn { border: 0; background: none; color: var(--muted); font-size: 12.5px; padding: 0; text-decoration: underline; }

  footer { margin-top: 24px; text-align: center; font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); }

  /* ---------- Sheet & toast ---------- */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 50; background: rgba(20, 10, 5, .45);
    display: flex; align-items: flex-end; justify-content: center; animation: fade .2s;
  }
  .sheet {
    width: 100%; max-width: 480px; max-height: 85vh; overflow: auto;
    background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 18px 22px;
    animation: up .25s ease-out;
  }
  .sheet-grip { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 10px; }
  .sheet h3 { margin: 4px 0 14px; font-size: 18px; }
  .sheet form { display: flex; gap: 8px; margin-top: 12px; }
  .sheet input {
    flex: 1; min-width: 0; padding: 11px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface-2); outline: none;
  }
  .sheet input:focus { border-color: var(--accent); }
  .places { list-style: none; margin: 10px 0 0; padding: 0; }
  .places button { width: 100%; text-align: left; border: 0; background: none; padding: 10px 6px; border-radius: 10px; }
  .places button:hover { background: var(--surface-2); }
  .places b { display: block; font-size: 15px; }
  .places small { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .w100 { width: 100%; }
  .mt8 { margin-top: 8px; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }

  .toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 60; max-width: calc(100% - 32px);
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 500; transition: .25s; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

  /* ---------- Desktop ---------- */
  @media (min-width: 600px) {
    .sheet-backdrop { align-items: center; }
    .sheet { border-radius: 22px; }
  }
  @media (min-width: 980px) {
    .app { max-width: 1180px; padding: 28px 28px 48px; }
    .top { margin-bottom: 22px; }
    h1 { font-size: 34px; }
    .loc-pill { max-width: 40%; }
    .layout { display: grid; grid-template-columns: 410px minmax(0, 1fr); gap: 22px; align-items: start; }
    .col { display: flex; flex-direction: column; gap: 22px; }
    .map-wrap { height: 340px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <p class="greet" id="greet">你好！</p>
      <h1>今天<span>吃什麼</span>？</h1>
    </div>
    <button class="loc-pill" id="locBtn" type="button" aria-label="更換地點">📍 <span id="locText">定位中…</span> <b>更換</b></button>
  </header>

  <div class="banner" id="banner" role="status" hidden>
    <span>💡</span><p id="bannerText"></p>
    <button class="retry" id="retryBtn" type="button" hidden>重新載入</button>
  </div>

  <main class="layout">
    <div class="col col-left">
      <section class="card" id="controls" aria-label="篩選條件">
        <div class="field">
          <div class="label">哪一餐</div>
          <div class="seg" id="mealSeg"></div>
        </div>
        <div class="field">
          <div class="label">距離範圍 <b id="radiusVal"></b></div>
          <div class="chips" id="radiusChips"></div>
        </div>
        <div class="field">
          <div class="label">想吃什麼類 <small>可以複選，右上角是附近家數</small></div>
          <div class="cat-grid" id="catGrid"></div>
        </div>
        <label class="toggle"><input type="checkbox" id="avoidRecent" /> 避開最近兩天吃過的</label>
        <button class="cta" id="spinBtn" type="button"><span class="dice">🎲</span> 幫我決定！</button>
      </section>

      <section class="card" id="historyCard" aria-label="最近吃過">
        <div class="list-head">
          <h2>最近吃過</h2>
          <button class="link-btn" id="clearHist" type="button">清除</button>
        </div>
        <ul class="hist" id="hist"></ul>
      </section>
    </div>

    <div class="col col-right">
      <section class="card result" id="result" aria-live="polite">
        <div class="slot" id="slot">
          <div class="slot-kicker" id="slotKicker">午餐吃什麼？</div>
          <div class="slot-main">
            <span class="slot-emoji" id="slotEmoji">🍽️</span>
            <span class="slot-name" id="slotName">交給我決定</span>
          </div>
        </div>
        <div class="pick" id="pick"></div>
        <div class="actions" id="actMain">
          <a class="btn primary" id="navBtn" target="_blank" rel="noopener">🧭 導航過去</a>
          <a class="btn" id="gBtn" target="_blank" rel="noopener">⭐ Google 看評價</a>
        </div>
        <div class="actions sub" id="actSub">
          <button class="btn ghost" id="rerollShop" type="button">🔄 換一家</button>
          <button class="btn ghost" id="rerollDish" type="button">🎲 換道菜</button>
          <button class="btn ok" id="eatBtn" type="button">就吃這個 ✓</button>
        </div>
      </section>

      <section class="card map-card" id="mapCard" aria-label="Google 地圖">
        <div class="map-head">
          <h2 id="mapTitle">地圖</h2>
          <a id="mapLink" target="_blank" rel="noopener">在 Google 地圖開啟 ↗</a>
        </div>
        <div class="map-wrap">
          <div class="map-empty" id="mapEmpty">定位中…</div>
          <iframe id="gmap" title="Google 地圖" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen hidden></iframe>
        </div>
      </section>

      <section class="card" id="listCard" aria-label="附近餐廳">
        <div class="list-head">
          <h2>附近餐廳</h2>
          <span id="count"></span>
        </div>
        <ul class="list" id="list"></ul>
      </section>
    </div>
  </main>

  <footer>
    餐廳資料 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 貢獻者 · 地圖與導航 © Google 地圖<br />
    你的位置只用來搜尋附近餐廳，不會被儲存。
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip"></div>
    <h3 id="sheetTitle">要在哪裡找吃的？</h3>
    <button class="btn primary w100" id="useGps" type="button">📍 使用我目前的位置</button>
    <form id="placeForm">
      <input id="placeInput" type="search" placeholder="輸入地點，例如：台北車站、逢甲夜市" autocomplete="off" />
      <button class="btn" type="submit">搜尋</button>
    </form>
    <ul class="places" id="places"></ul>
    <button class="btn ghost w100 mt8" id="closeSheet" type="button">取消</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';

  /* ================= 設定與資料 ================= */

  const DEFAULT_LOC = { lat: 25.033968, lng: 121.564468, label: '台北101（預設）' };
  // 公開的 OSM 伺服器偶爾會忙（504），所以準備幾台輪流問
  const OVERPASS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.private.coffee/api/interpreter',
  ];
  const CACHE_TTL = 6 * 3600e3;

  const MEALS = [
    { id: 'breakfast', label: '早餐', emoji: '🌅', q: '早餐' },
    { id: 'lunch',     label: '午餐', emoji: '☀️', q: '午餐 餐廳' },
    { id: 'dinner',    label: '晚餐', emoji: '🌆', q: '晚餐 餐廳' },
    { id: 'night',     label: '宵夜', emoji: '🌙', q: '宵夜' },
  ];
  const RADII = [300, 500, 1000, 2000, 5000];

  // 類別：kw 用來比對店名（小寫），q 是丟給 Google 搜尋的字
  const CATS = [

      const area = a.suburb || a.city_district || a.district || a.town || a.village || '';
      const road = a.road || a.neighbourhood || a.quarter || '';
      return [city + (area && area !== city ? area : ''), road].filter(Boolean).join(' ') || j.name || null;
    } catch { return null; }
  }

  // 先問第一台；4 秒沒回應（或直接失敗）就同時問下一台，誰先回來用誰
  function hedgedFetch(q) {
    return new Promise((resolve, reject) => {
      let next = 0, pending = 0, done = false, lastErr, hedgeTimer;
      const ctls = [];
      const launch = () => {
        if (done || next >= OVERPASS.length) return;
        const url = OVERPASS[next++];
        pending++;
        const ctl = new AbortController();
        ctls.push(ctl);
        const kill = setTimeout(() => ctl.abort(), 20000);
        clearTimeout(hedgeTimer);
        hedgeTimer = setTimeout(launch, 4000);
        fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'data=' + encodeURIComponent(q),
          signal: ctl.signal,
        })
          .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(j => {
            if (done) return;
            done = true; clearTimeout(hedgeTimer);
            ctls.forEach(c => c.abort());
            resolve(j);
          })
          .catch(e => {
            lastErr = e; pending--;
            if (done) return;
            if (next < OVERPASS.length) launch();
            else if (!pending) { clearTimeout(hedgeTimer); reject(lastErr); }
          })
          .finally(() => clearTimeout(kill));
      };
      launch();
    });
  }

  function writeCache(loc, radius, shops) {
    store.set('shopCache', {
      v: 2, key: cacheKey(loc), radius, ts: Date.now(),
      shops: shops.map(s => [s.id, s.name, s.lat, s.lng, s.amenity, s.cuisine, s.veg ? 1 : 0, s.hours, s.addr]),
    });
  }

  async function loadShops() {
    if (!state.loc) return;
    if (state.fetchedRadius >= state.radius) { renderAll(); return; }
    const radius = Math.max(state.radius, 1000);
    const cached = readCache(state.loc, radius);
    if (cached) {
      Object.assign(state, { shops: cached, fetchedRadius: radius, demo: false });
      setDataNote(null);
      renderAll();
      return;
    }
    const token = ++state.loadToken;
    state.loading = true;
    renderList(); renderCats();
    try {
      const data = await overpass(state.loc.lat, state.loc.lng, radius);
      if (token !== state.loadToken) return;
      state.shops = parseShops(data);
      state.fetchedRadius = radius;
      state.demo = false;
      writeCache(state.loc, radius, state.shops);
      setDataNote(null);
    } catch (e) {
      if (token !== state.loadToken) return;
      console.warn('Overpass 失敗，改用示範資料', e);
      state.shops = demoShops(state.loc);
      state.fetchedRadius = Infinity;
      state.demo = true;
      setDataNote('餐廳資料庫現在太忙，先顯示「示範餐廳」（店名是虛構的），Google 按鈕會改成直接搜尋附近。');
    }
    state.loading = false;
    renderAll();
  }

  function setDataNote(msg) {
    note('data', msg);
    $('#retryBtn').hidden = !msg;
  }

  function addrOf(t) {
    if (t['addr:full']) return t['addr:full'];
    const street = t['addr:street'] || '', no = t['addr:housenumber'] || '';
    if (!street) return '';
    if (/[一-鿿]/.test(street)) return street + (no ? no + (/^\d+$/.test(no) ? '號' : '') : '');
    return [no, street].filter(Boolean).join(' ');
  }

  function classify(t, name) {
    const cats = new Set();
    String(t.cuisine || '').toLowerCase().split(/[;,]/).forEach(c => {
      const m = CUISINE_MAP[c.trim()];
      if (m) [].concat(m).forEach(x => cats.add(x));
    });
    if (t.amenity === 'cafe' || t.amenity === 'ice_cream') cats.add('cafe');
    if (/^(yes|only)$/.test(t['diet:vegetarian'] || '') || /^(yes|only)$/.test(t['diet:vegan'] || '')) cats.add('veg');
    // 先拿掉容易誤判的詞：飯店不是飯類、麵包不是麵食、鍋貼和鍋燒麵不是火鍋
    const n = name.toLowerCase().replace(/飯店|麵包|鍋貼|鍋燒/g, '');
    for (const c of CATS) if (c.kw && c.kw.some(k => n.includes(k))) cats.add(c.id);
    return cats;
  }

  function parseShops(data) {
    const out = [];
    for (const el of data.elements || []) {
      const t = el.tags || {};
      const name = t['name:zh-Hant'] || t['name:zh_TW'] || t.name || t['name:zh'];
      const lat = el.lat ?? el.center?.lat, lng = el.lon ?? el.center?.lon;
      if (!name || lat == null) continue;
      const veg = /^(yes|only)$/.test(t['diet:vegetarian'] || '') || /^(yes|only)$/.test(t['diet:vegan'] || '');
      out.push(makeShop(el.type + el.id, name, lat, lng, classify(t, name), t.amenity, t.opening_hours || '', addrOf(t), t.cuisine || '', veg));
    }
    return out.sort((a, b) => a.dist - b.dist);
  }

  function makeShop(id, name, lat, lng, cats, amenity, hours, addr, cuisine = '', veg = false) {
    return { id, name, lat, lng, cats, amenity, hours, addr, cuisine, veg, nameLower: name.toLowerCase(), dist: haversine(state.loc, { lat, lng }) };
  }

  function demoShops(loc) {
    const list = [
      ['老王牛肉麵', ['noodle', 'chinese'], '11:00-20:30'], ['巷口早餐店', ['breakfast', 'chinese'], '05:30-11:00'],
      ['山田拉麵', ['japanese', 'noodle'], '11:30-21:00'], ['首爾炸雞', ['korean'], '16:00-01:00'],
      ['小義廚房', ['italian'], ''], ['曼谷小館', ['sea', 'rice'], ''], ['麻辣天堂火鍋', ['hotpot'], '11:30-02:00'],
      ['炭火燒肉亭', ['bbq', 'japanese'], '17:00-23:30'], ['阿嬤滷肉飯', ['rice', 'chinese'], ''], ['福氣便當', ['rice', 'chinese'], ''],
      ['晨光早午餐', ['breakfast', 'cafe'], '07:00-15:00'], ['街角咖啡', ['cafe'], ''], ['蓮心素食', ['veg', 'rice'], ''],
      ['海味熱炒', ['chinese'], '17:00-01:00'], ['豆花伯', ['cafe'], ''], ['夜市鹽酥雞', ['chinese'], '17:00-00:30'],
      ['港仔茶餐廳', ['chinese', 'rice'], ''], ['壽司小築', ['japanese'], ''], ['美式漢堡屋', ['western'], ''],
      ['河內河粉', ['sea', 'noodle'], ''], ['一品水餃', ['chinese'], ''], ['咖哩工房', ['japanese', 'rice', 'sea'], ''],
      ['韓兄弟部隊鍋', ['korean', 'hotpot'], ''], ['深夜清粥小菜', ['chinese', 'rice'], '18:00-04:00'],
      ['老街滷味', ['chinese'], ''], ['永和豆漿大王', ['breakfast', 'chinese'], '24 小時'], ['義式披薩坊', ['italian', 'western'], ''],
      ['薑母鴨之家', ['hotpot', 'chinese'], '17:00-02:00'],
    ];
    let seed = 20260929;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
    return list.map(([name, cats, hours], i) => {
      const r = 80 + rnd() * 1700, a = rnd() * Math.PI * 2;
      const lat = loc.lat + (r * Math.cos(a)) / 111320;
      const lng = loc.lng + (r * Math.sin(a)) / (111320 * Math.cos(loc.lat * Math.PI / 180));
      return makeShop('demo' + i, name, lat, lng, new Set(cats), 'restaurant', hours, '');
    }).sort((a, b) => a.dist - b.dist);
  }

  /* ================= 推薦邏輯 ================= */

  const inRange = () => state.shops.filter(s => s.dist <= state.radius);
  const kwHit = (shop, dish) => dish.kw.find(k => shop.nameLower.includes(k));
  const catHit = (shop, dish) => dish.cats.some(c => shop.cats.has(c));
  const matchScore = (shop, dish) => (kwHit(shop, dish) ? 6 : 0) + (catHit(shop, dish) ? 1 : 0);

  function shopMatchesFilter(s) {
    return state.cats.has('any') || [...state.cats].some(c => s.cats.has(c));
  }

  function recentDishes(hours = 48) {
    const since = Date.now() - hours * 3600e3;
    return new Set(store.get('history', []).filter(h => h.ts >= since).map(h => h.dish));
  }

  function dishPool(excludeName) {
    let pool = DISHES[state.meal];
    if (!state.cats.has('any')) {
      const want = d => d.cats.some(c => state.cats.has(c));
      let p = pool.filter(want);
      if (!p.length) p = ALL_DISHES.filter(want);
      if (!p.length) p = [...state.cats].map(c => D(CAT[c].label, CAT[c].emoji, [c], []));
      pool = p;
    }
    if (state.avoidRecent) {
      const recent = recentDishes();
      const p = pool.filter(d => !recent.has(d.name));
      if (p.length) pool = p;
    }
    if (excludeName && pool.length > 1) pool = pool.filter(d => d.name !== excludeName);
    return pool;
  }

  function dishWeight(dish, shops) {
    if (shops.some(s => kwHit(s, dish))) return 4;
    if (shops.some(s => catHit(s, dish))) return 2;
    return 1;
  }

  function pickShop(dish) {
    // 有選類別的話，店也要屬於那些類別（選了日式就不會跳出中式的咖哩飯）
    const all = inRange();
    const filtered = all.filter(shopMatchesFilter);
    const shops = filtered.some(s => matchScore(s, dish) > 0) ? filtered : all;
    // 店名直接有這道菜的優先；都看過了才退而求其次，給同類型的店
    const avail = shops.filter(s => !state.skip.has(s.id));
    const hits = avail.filter(s => kwHit(s, dish));
    const pool = hits.length ? hits : avail.filter(s => catHit(s, dish));
    if (!pool.length && state.skip.size) {
      const any = shops.some(s => matchScore(s, dish) > 0);
      if (any) { toast('附近符合的店都看過一輪了，重新來過 🔁'); state.skip.clear(); return pickShop(dish); }
    }
    if (!pool.length) return null;
    return weightedPick(pool, s => 1 / (1 + s.dist / 400));
  }

  function animateSlot(pool) {
    return new Promise(resolve => {
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const slot = $('#slot');
      slot.classList.remove('landed');
      slot.classList.add('spinning');
      let i = 0, delay = 50;
      const steps = reduce ? 0 : 16;
      (function step() {
        if (i >= steps) { slot.classList.remove('spinning'); resolve(); return; }
        const d = pool[Math.floor(Math.random() * pool.length)];
        setSlot(d.emoji, d.name);
        i++; delay *= 1.1;
        setTimeout(step, delay);
      })();
    });
  }

  async function spin(excludeName) {
    if (state.spinning) return;
    const pool = dishPool(excludeName);
    const shops = inRange().filter(shopMatchesFilter);
    const final = weightedPick(pool, d => dishWeight(d, shops));

    state.spinning = true;
    state.shop = null; state.kicker = null; state.skip.clear();
    const btn = $('#spinBtn');
    btn.disabled = true; btn.classList.add('rolling');
    $('#pick').innerHTML = `<p class="pick-idle">命運轉動中…</p>`;
    $('#actMain').hidden = true; $('#actSub').hidden = true;

    await animateSlot(pool.length > 1 ? pool : ALL_DISHES);

    state.dish = final;
    state.shop = pickShop(final);
    state.spinning = false;
    btn.disabled = false; btn.classList.remove('rolling');
    const slot = $('#slot');
    void slot.offsetWidth; // 重新觸發動畫
    slot.classList.add('landed');

    renderResult(); renderMap(); renderList();
    if (window.innerWidth < 980) $('#result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function rerollShop() {
    if (!state.dish) return;
    if (state.shop) state.skip.add(state.shop.id);
    const next = pickShop(state.dish);
    if (!next) { toast(`附近只有這家有「${state.dish.name}」`); return; }
    state.shop = next; state.kicker = null;
    renderResult(); renderMap(); renderList();
  }

  function eat() {
    const { dish, shop } = state;
    if (!dish && !shop) return;
    const h = store.get('history', []);
    h.unshift({
      dish: dish ? dish.name : (shop ? primaryLabel(shop) : ''),
      emoji: dish ? dish.emoji : shopEmoji(shop),
      shop: shop && !state.demo ? shop.name : (shop ? shop.name + '（示範）' : ''),
      meal: state.meal, ts: Date.now(),
    });
    store.set('history', h.slice(0, 30));
    renderHistory();
    const meal = MEALS.find(m => m.id === state.meal).label;
    toast(`記下來了！${meal}吃${dish ? dish.name : shop.name}，祝用餐愉快 😋`);
  }

  /* ================= 畫面 ================= */

  function setLocText(t) { $('#locText').textContent = t; }
  function setSlot(emoji, name) { $('#slotEmoji').textContent = emoji; $('#slotName').textContent = name; }

  function note(key, msg) {
    if (msg) state.notes[key] = msg; else delete state.notes[key];
    const all = Object.values(state.notes);
    $('#banner').hidden = !all.length;
    $('#bannerText').textContent = all.join(' ');
  }

  let toastTimer;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  function shopEmoji(s) {
    const c = EMOJI_PRIORITY.find(id => s.cats.has(id));
    return c ? CAT[c].emoji : '🍽️';
  }
  function primaryLabel(s) {
    const c = EMOJI_PRIORITY.find(id => s.cats.has(id));
    return c ? CAT[c].label : (AMENITY_LABEL[s.amenity] || '餐廳');
  }
  function shopCatText(s) {
    const labels = [...s.cats].slice(0, 3).map(c => CAT[c].label);
    return labels.length ? labels.join(' · ') : (AMENITY_LABEL[s.amenity] || '餐廳');
  }

  function searchTerm() {
    if (state.dish) return state.dish.name;
    const picked = [...state.cats].filter(c => c !== 'any');
    if (picked.length) return CAT[picked[0]].q;
    return MEALS.find(m => m.id === state.meal).q;
  }

  function renderGreeting() {
    const h = new Date().getHours();
    const hello = h < 4 ? '夜深了，' : h < 11 ? '早安！' : h < 18 ? '午安！' : '晚安！';
    const meal = MEALS.find(m => m.id === state.meal).label;
    $('#greet').textContent = `${hello}又到了煩惱${meal}的時間`;
  }

  function renderMeals() {
    $('#mealSeg').innerHTML = MEALS.map(m =>
      `<button type="button" data-meal="${m.id}" aria-pressed="${m.id === state.meal}"><span class="e">${m.emoji}</span>${m.label}</button>`
    ).join('');
  }

  function renderRadius() {
    $('#radiusChips').innerHTML = RADII.map(r =>
      `<button type="button" class="chip" data-r="${r}" aria-pressed="${r === state.radius}">${fmtDist(r)}</button>`
    ).join('');
    $('#radiusVal').textContent = `方圓 ${fmtDist(state.radius)}`;
  }

  function renderCats() {
    const shops = state.loading ? [] : inRange();
    $('#catGrid').innerHTML = CATS.map(c => {
      const n = c.id === 'any' ? shops.length : shops.filter(s => s.cats.has(c.id)).length;
      const badge = state.loading || !state.loc ? '' : `<span class="n">${n}</span>`;
      return `<button type="button" class="cat" data-cat="${c.id}" aria-pressed="${state.cats.has(c.id)}">${badge}<span class="e">${c.emoji}</span>${c.label}</button>`;
    }).join('');
  }

  function renderResult() {
    const { dish, shop } = state;
    const meal = MEALS.find(m => m.id === state.meal);
    const pick = $('#pick'), main = $('#actMain'), sub = $('#actSub');
    const nav = $('#navBtn'), g = $('#gBtn');

    const kicker = dish ? `${meal.label}就吃這個` : shop ? '你挑的這家' : `${meal.label}吃什麼？`;
    $('#slotKicker').textContent = (dish || shop) && state.kicker ? state.kicker : kicker;

    if (!dish && !shop) {
      setSlot('🍽️', '交給我決定');
      pick.innerHTML = `<p class="pick-idle">選好「哪一餐、距離、想吃的類型」<br>按下 <b>幫我決定</b>，剩下的交給命運 🎲</p>`;
      main.hidden = true; sub.hidden = true;
      return;
    }

    if (dish) setSlot(dish.emoji, dish.name); else setSlot(shopEmoji(shop), primaryLabel(shop));
    main.hidden = false; sub.hidden = false;
    $('#rerollShop').disabled = !dish;

    if (shop) {
      const hit = dish && kwHit(shop, dish);
      const catTags = [...shop.cats].slice(0, 3).map(c => `<span class="tag">${CAT[c].emoji} ${CAT[c].label}</span>`).join('');
      pick.innerHTML = `
        <div class="pick-name">${esc(shop.name)}${state.demo ? ' <span class="tag">示範</span>' : ''}</div>
        <div class="pick-meta">${fmtDist(shop.dist)} · ${travel(shop.dist)}${shop.addr ? ' · ' + esc(shop.addr) : ''}</div>
        <div class="tags">
          ${dish ? (hit ? `<span class="tag hit">🎯 店名就有「${esc(hit)}」</span>` : `<span class="tag">同類型餐廳，可能有賣</span>`) : ''}
          ${catTags}
          ${shop.hours ? `<span class="tag">🕒 ${esc(shop.hours)}</span>` : ''}
        </div>`;
      if (state.demo) {
        nav.hidden = true;
        g.hidden = false; g.classList.add('wide');
        g.textContent = `🔎 在 Google 地圖找附近「${searchTerm()}」`;
        g.href = gSearch(searchTerm(), state.loc, zoomFor(state.radius));
      } else {
        nav.hidden = false; nav.href = gDir(shop);
        g.hidden = false; g.classList.remove('wide');
        g.textContent = '⭐ Google 看評價';
        g.href = gPlace(shop);
      }
    } else {
      pick.innerHTML = `
        <div class="pick-name">方圓 ${fmtDist(state.radius)} 內沒找到「${esc(dish.name)}」</div>
        <div class="pick-meta">開放地圖的資料不一定齊全，直接問 Google 地圖最準 👇</div>`;
      nav.hidden = true;
      g.hidden = false; g.classList.add('wide');
      g.textContent = `🔎 在 Google 地圖找附近「${dish.name}」`;
      g.href = gSearch(dish.name, state.loc, zoomFor(state.radius));
    }
  }

  function renderMap() {
    const iframe = $('#gmap'), empty = $('#mapEmpty');
    if (!state.loc) { iframe.hidden = true; empty.hidden = false; return; }
    const term = searchTerm();
    const showShop = state.shop && !state.demo;
    const src = showShop ? gEmbedPlace(state.shop) : gEmbedSearch(term, state.loc, zoomFor(state.radius));
    if (iframe.dataset.src !== src) { iframe.src = src; iframe.dataset.src = src; }
    iframe.hidden = false; empty.hidden = true;
    $('#mapTitle').textContent = showShop ? `📍 ${state.shop.name}` : `🗺️ 附近的「${term}」`;
    $('#mapLink').href = showShop ? gPlace(state.shop) : gSearch(term, state.loc, zoomFor(state.radius));
  }

  function renderList() {
    const list = $('#list'), count = $('#count');
    if (!state.loc || state.loading) {
      count.textContent = '搜尋中…';
      list.innerHTML = Array.from({ length: 5 }, () =>
        `<li class="sk"><i style="width:42px;height:42px"></i><div style="flex:1"><i style="height:14px;width:60%"></i><i style="height:11px;width:40%;margin-top:6px"></i></div><i style="width:40px;height:14px"></i></li>`
      ).join('');
      return;
    }
    const shops = inRange().filter(shopMatchesFilter);
    count.textContent = `${shops.length} 家 · ${fmtDist(state.radius)}內${state.demo ? '（示範）' : ''}`;
    if (!shops.length) {
      const term = searchTerm();
      list.innerHTML = `<li class="empty">這個範圍內沒找到符合的餐廳 😢<br>試試放大距離，或 <a href="${gSearch(term, state.loc, zoomFor(state.radius))}" target="_blank" rel="noopener">直接在 Google 地圖搜尋「${esc(term)}」</a></li>`;
      return;
    }
    const shown = shops.slice(0, state.listLimit);
    list.innerHTML = shown.map(s => `
      <li class="item${state.shop && state.shop.id === s.id ? ' active' : ''}" data-id="${esc(s.id)}" tabindex="0" role="button">
        <div class="item-emoji">${shopEmoji(s)}</div>
        <div class="item-body">
          <div class="item-name">${esc(s.name)}</div>
          <div class="item-meta">${esc(shopCatText(s))}${s.hours ? ' · 🕒 ' + esc(s.hours) : ''}</div>
        </div>
        <div class="item-dist">${fmtShort(s.dist)}<small>${travel(s.dist)}</small></div>
      </li>`).join('') +
      (shops.length > shown.length ? `<li><button class="btn ghost more" id="moreBtn" type="button">再顯示 ${Math.min(20, shops.length - shown.length)} 家（還有 ${shops.length - shown.length} 家）</button></li>` : '');
  }

  function renderHistory() {
    const h = store.get('history', []);
    $('#clearHist').hidden = !h.length;
    if (!h.length) {
      $('#hist').innerHTML = `<li class="empty" style="display:block;padding:10px 0">還沒有紀錄。按「就吃這個」就會記下來，之後可以避開重複 👌</li>`;
      return;
    }
    const day = ts => {
      const d0 = new Date(); d0.setHours(0, 0, 0, 0);
      const diff = Math.floor((d0 - new Date(ts).setHours(0, 0, 0, 0)) / 864e5);
      return diff <= 0 ? '今天' : diff === 1 ? '昨天' : `${diff} 天前`;
    };
    $('#hist').innerHTML = h.slice(0, 6).map(x => `
      <li><span class="h-e">${x.emoji}</span>
        <div><b>${esc(x.dish)}</b>${x.shop ? ' · ' + esc(x.shop) : ''}
        <small>${day(x.ts)} ${MEALS.find(m => m.id === x.meal)?.label || ''}</small></div></li>`).join('');
  }

  function renderAll() {
    renderCats(); renderResult(); renderMap(); renderList();
  }

  /* ================= 事件 ================= */

  $('#mealSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-meal]'); if (!b) return;
    state.meal = b.dataset.meal;
    renderMeals(); renderGreeting(); renderResult();
    if (!state.dish && !state.shop) renderMap();
  });

  $('#radiusChips').addEventListener('click', e => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    state.radius = Number(b.dataset.r); state.listLimit = 20;
    store.set('radius', state.radius);
    renderRadius();
    if (state.loc && state.radius > state.fetchedRadius) loadShops(); else renderAll();
  });

  $('#catGrid').addEventListener('click', e => {
    const b = e.target.closest('[data-cat]'); if (!b) return;
    const id = b.dataset.cat;
    if (id === 'any') state.cats = new Set(['any']);
    else {
      state.cats.delete('any');
      state.cats.has(id) ? state.cats.delete(id) : state.cats.add(id);
      if (!state.cats.size) state.cats.add('any');
    }
    state.listLimit = 20;
    renderCats(); renderList();
    if (!state.dish && !state.shop) renderMap();
  });

  $('#avoidRecent').checked = state.avoidRecent;
  $('#avoidRecent').addEventListener('change', e => { state.avoidRecent = e.target.checked; store.set('avoidRecent', state.avoidRecent); });

  $('#spinBtn').addEventListener('click', () => spin());
  $('#rerollDish').addEventListener('click', () => spin(state.dish && state.dish.name));
  $('#rerollShop').addEventListener('click', rerollShop);
  $('#eatBtn').addEventListener('click', eat);
  $('#retryBtn').addEventListener('click', () => {
    state.fetchedRadius = 0; state.shop = null; state.dish = null;
    loadShops();
  });
  $('#clearHist').addEventListener('click', () => { store.set('history', []); renderHistory(); toast('紀錄已清除'); });

  function selectShop(id) {
    const s = state.shops.find(x => x.id === id); if (!s) return;
    state.shop = s; state.kicker = null;
    if (state.dish && !kwHit(s, state.dish)) state.dish = null;
    renderResult(); renderMap(); renderList();
    if (window.innerWidth < 980) $('#result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  $('#list').addEventListener('click', e => {
    if (e.target.closest('#moreBtn')) { state.listLimit += 20; renderList(); return; }
    const li = e.target.closest('[data-id]'); if (li) selectShop(li.dataset.id);
  });
  $('#list').addEventListener('keydown', e => {
    const li = e.target.closest('[data-id]');
    if (li && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selectShop(li.dataset.id); }
  });

  // 更換地點
  const sheet = $('#sheet');
  const openSheet = () => { sheet.hidden = false; $('#places').innerHTML = ''; setTimeout(() => $('#placeInput').focus(), 50); };
  const closeSheet = () => { sheet.hidden = true; };
  $('#locBtn').addEventListener('click', openSheet);
  $('#closeSheet').addEventListener('click', closeSheet);
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
  $('#useGps').addEventListener('click', () => { closeSheet(); locate(); });

  let placeResults = [];
  $('#placeForm').addEventListener('submit', async e => {
    e.preventDefault();
    const q = $('#placeInput').value.trim(); if (!q) return;
    const ul = $('#places');
    ul.innerHTML = `<li class="empty">搜尋中…</li>`;
    try {
      placeResults = await searchPlace(q);
      ul.innerHTML = placeResults.length
        ? placeResults.map((p, i) => `<li><button type="button" data-i="${i}"><b>${esc(p.name || p.display_name.split(',')[0])}</b><small>${esc(p.display_name)}</small></button></li>`).join('')
        : `<li class="empty">找不到這個地點，換個關鍵字試試</li>`;
    } catch {
      ul.innerHTML = `<li class="empty">搜尋失敗，請檢查網路後再試一次</li>`;
    }
  });
  $('#places').addEventListener('click', e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    const p = placeResults[Number(b.dataset.i)];
    closeSheet();
    note('loc', null);
    setLocation(Number(p.lat), Number(p.lon), p.name || p.display_name.split(',')[0]);
  });

  /* ================= 給外掛用的介面 ================= */
  // jev.js 之類的外掛透過這裡拿資料、顯示結果；沒有外掛也不影響主程式

  window.SanCan = {
    get state() { return state; },
    DISHES, ALL_DISHES, CAT, MEALS,
    inRange, shopMatchesFilter, kwHit, catHit,
    fmtDist, travel, esc, toast, shopCatText, shopEmoji,
    history: () => store.get('history', []),
    searchUrl: term => gSearch(term, state.loc, zoomFor(state.radius)),
    setPick(dish, shop, { kicker = null } = {}) {
      Object.assign(state, { dish, shop, kicker });
      state.skip.clear();
      const slot = $('#slot');
      slot.classList.remove('landed'); void slot.offsetWidth; slot.classList.add('landed');
      renderResult(); renderMap(); renderList();
      if (window.innerWidth < 980) $('#result').scrollIntoView({ behavior: 'smooth', block: 'start' });
    },
  };

  /* ================= 開始 ================= */

  renderGreeting(); renderMeals(); renderRadius(); renderCats(); renderResult(); renderList(); renderHistory();
  locate();
})();
</script>

<script src="jev.js"></script>
